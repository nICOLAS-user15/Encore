name: Release

# Pushing a tag like v1.2.0 publishes a GitHub release whose notes are the
# "## [1.2.0]" section of CHANGELOG.md. The procedure is in CLAUDE.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the package.json version
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(jq -r .version package.json)"
          if [ "$version" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected."
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Print the lines after "## [<version>]" up to the next section or the link list.
          awk -v heading="## [$version]" '
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
            index($0, heading) == 1 { found = 1 }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no notes for $version."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Encore $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
