<!doctype html>
<!-- The dark background comes from the CSS (theme.css), which blocks rendering: no white "flash".
     No inline `style` here, so the security policy (CSP) does not need 'unsafe-inline'. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the app fills the whole screen, including behind the notch.
         Safe margins are applied in the CSS with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="Offline-first strength workout log." />
    <meta name="theme-color" content="#0e0d0c" />
    <meta name="color-scheme" content="dark" />

    <!-- Icons (generated by `pnpm generate-icons`). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- iOS: opens full screen when installed on the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Encore" />

    <title>Encore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
